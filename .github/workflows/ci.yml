name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # openai-whisper pulls in torch (~700 MB). For an import smoke-test we
      # only need the FastAPI + pydantic + Gemini side of the stack and we
      # stub whisper at runtime below. The langchain pin matches
      # requirements.txt because the agents use the legacy
      # `from langchain.prompts import ...` import path that langchain 1.0
      # removed.
      - name: Install lightweight runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi 'uvicorn[standard]' python-dotenv \
            'langchain>=0.3,<1.0' langchain-google-genai google-generativeai \
            pypdf pydantic gTTS

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff (non-blocking)
        # Lint is informational until the codebase is fully ruff-clean.
        run: ruff check app || true

      - name: Smoke-import FastAPI app
        env:
          # question_generator.py raises at import time if GOOGLE_API_KEY is
          # missing. genai.configure() accepts any string — we never make a
          # real network call in CI.
          GOOGLE_API_KEY: ci-dummy-key
        run: |
          python - <<'PY'
          import importlib, sys, types
          # Stub whisper so we don't download torch / model weights in CI.
          if 'whisper' not in sys.modules:
              stub = types.ModuleType('whisper')
              stub.load_model = lambda *_a, **_k: types.SimpleNamespace(
                  transcribe=lambda *_a, **_k: {'text': ''}
              )
              sys.modules['whisper'] = stub
          mod = importlib.import_module('app.main')
          assert hasattr(mod, 'app'), 'FastAPI app not found'
          print('OK: app.main imported, FastAPI app present')
          PY
