name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime deps
          # openai-whisper pulls in torch which is heavy; the import check
          # below only needs the FastAPI + pydantic side of the stack.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi 'uvicorn[standard]' python-dotenv langchain langchain-openai pypdf pydantic gTTS

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff (lint)
        run: ruff check app || true

      - name: Smoke-import FastAPI app
        run: |
          python - <<'PY'
          import importlib, sys
          # Heavy/optional imports stubbed so CI can import app.main without
          # downloading torch / whisper model weights.
          import types
          for stub in ('whisper',):
              if stub not in sys.modules:
                  sys.modules[stub] = types.ModuleType(stub)
          mod = importlib.import_module('app.main')
          assert hasattr(mod, 'app'), 'FastAPI app not found'
          print('OK: app.main imported, FastAPI app present')
          PY
